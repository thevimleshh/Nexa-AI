
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Nexa AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #111318;
            color: #ffffff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .glow-one {
            position: absolute;
            width: 350px;
            height: 350px;

            top: -150px;
            left: -100px;

            background: rgba(139, 92, 246, 0.10);
            filter: blur(100px);
            border-radius: 50%;
        }

        .glow-two {
            position: absolute;
            width: 300px;
            height: 300px;

            right: -100px;
            bottom: -120px;

            background: rgba(59, 130, 246, 0.08);
            filter: blur(100px);
            border-radius: 50%;
        }

        /* =========================
           LOGIN CONTAINER
        ========================= */

        .login-container {
            width: 100%;
            max-width: 420px;

            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: rgba(28, 31, 38, 0.96);

            border: 1px solid #30343d;
            border-radius: 18px;

            padding: 38px 34px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);
        }

        /* =========================
           LOGO
        ========================= */

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 52px;
            height: 52px;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: #252830;
            border: 1px solid #343943;

            color: #ffffff;
            font-size: 25px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .logo-name {
            font-size: 23px;
            font-weight: 600;
            letter-spacing: -0.4px;
        }

        .logo-subtitle {
            margin-top: 7px;

            color: #858b97;
            font-size: 13px;
        }

        /* =========================
           FORM
        ========================= */

        .login-title {
            font-size: 21px;
            font-weight: 600;

            margin-bottom: 7px;
        }

        .login-description {
            color: #858b97;
            font-size: 13px;

            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;

            margin-bottom: 8px;

            color: #c5c9d2;
            font-size: 13px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;

            height: 45px;

            padding: 0 13px;

            background: #15181e;

            border: 1px solid #30343d;
            border-radius: 9px;

            outline: none;

            color: #ffffff;
            font-size: 13px;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-input::placeholder {
            color: #606671;
        }

        .form-input:focus {
            border-color: #565d69;

            background: #171a20;

            box-shadow:
                0 0 0 3px rgba(139, 146, 158, 0.08);
        }

        /* =========================
           PASSWORD
        ========================= */

        .password-input {
            padding-right: 72px;
        }

        .show-password {
            position: absolute;

            right: 11px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #777d89;

            font-size: 12px;
            cursor: pointer;

            padding: 5px;
        }

        .show-password:hover {
            color: #ffffff;
        }

        /* =========================
           OPTIONS
        ========================= */

        .form-options {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin: 4px 0 22px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;

            color: #8f95a1;
            font-size: 12px;

            cursor: pointer;
        }

        .remember input {
            accent-color: #777d89;
            cursor: pointer;
        }

        .forgot-password {
            color: #aeb3bd;
            font-size: 12px;

            text-decoration: none;
        }

        .forgot-password:hover {
            color: #ffffff;
        }

        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {
            width: 100%;
            height: 45px;

            border: none;
            border-radius: 9px;

            background: #ffffff;
            color: #111318;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-button:hover {
            background: #e7e7e7;

            transform: translateY(-1px);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* =========================
           DIVIDER
        ========================= */

        .divider {
            display: flex;
            align-items: center;

            gap: 12px;

            margin: 25px 0;

            color: #606671;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";

            height: 1px;
            flex: 1;

            background: #30343d;
        }

        /* =========================
           SIGNUP
        ========================= */

        .signup-text {
            text-align: center;

            color: #858b97;
            font-size: 13px;
        }

        .signup-link {
            color: #ffffff;

            font-weight: 500;

            text-decoration: none;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            margin-top: 20px;

            color: #555b66;
            font-size: 11px;
        }

        /* =========================
           ERROR MESSAGE
        ========================= */

        .error-message {
            display: none;

            margin-bottom: 17px;
            padding: 10px 12px;

            border-radius: 8px;

            background: rgba(220, 53, 69, 0.10);
            border: 1px solid rgba(220, 53, 69, 0.25);

            color: #e58b94;

            font-size: 12px;
            line-height: 1.4;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .login-container {
                padding: 15px;
            }

            .login-card {
                padding: 30px 24px;
            }

            .logo-section {
                margin-bottom: 25px;
            }

        }

    </style>

</head>


<body>

    <div class="background">

        <div class="glow-one"></div>
        <div class="glow-two"></div>

    </div>


    <main class="login-container">

        <div class="login-card">


            <!-- LOGO -->

            <div class="logo-section">

                <div class="logo-icon">
                    ✦
                </div>

                <div class="logo-name">
                    Nexa AI
                </div>

                <div class="logo-subtitle">
                    Your intelligent AI workspace
                </div>

            </div>


            <!-- LOGIN -->

            <h1 class="login-title">
                Welcome back
            </h1>

            <p class="login-description">
                Sign in to continue your conversations with Nexa AI.
            </p>


            <!-- ERROR -->

            <div
                class="error-message"
                id="errorMessage"
            ></div>


            <!-- FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="email"
                    >
                        Email address
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="email"
                            id="email"
                            class="form-input"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="password"
                    >
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            class="form-input password-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->

                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a
                        href="#"
                        class="forgot-password"
                    >
                        Forgot password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Sign in
                </button>

            </form>


            <!-- DIVIDER -->

            <div class="divider">
                OR
            </div>


            <!-- SIGNUP -->

            <div class="signup-text">

                Don't have an account?

                <a
                    href="/signup"
                    class="signup-link"
                >
                    Create account
                </a>

            </div>

        </div>


        <div class="footer">
            © 2026 Nexa AI
        </div>

    </main>


    <script>

        /* =========================
           SHOW / HIDE PASSWORD
        ========================= */

        const passwordInput =
            document.getElementById(
                "password"
            );

        const showPasswordButton =
            document.getElementById(
                "showPassword"
            );


        showPasswordButton.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    showPasswordButton.textContent =
                        "Hide";

                } else {

                    passwordInput.type =
                        "password";

                    showPasswordButton.textContent =
                        "Show";
                }

            }
        );


        /* =========================
           LOGIN FORM
        ========================= */

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();

                const password =
                    passwordInput.value;


                errorMessage.style.display =
                    "none";


                try {

                    const response =
                        await fetch(
                            "/api/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!data.success) {

                        errorMessage.textContent =
                            data.error ||
                            "Invalid email or password.";

                        errorMessage.style.display =
                            "block";

                        return;
                    }


                    /*
                     * Login successful
                     */

                    window.location.href =
                        "/";

                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    errorMessage.textContent =
                        "Unable to connect to the server. Please try again.";

                    errorMessage.style.display =
                        "block";
                }

            }
        );

    </script>

</body>

</html>
