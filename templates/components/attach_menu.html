<div class="attach-menu-wrapper">

    <!-- + BUTTON -->

    <button
        class="attach-button"
        id="attachButton"
        type="button"
        aria-label="Open attachment options"
    >
        ＋
    </button>


    <!-- ATTACHMENT MENU -->

    <div
        class="attach-menu"
        id="attachMenu"
    >

        <!-- IMAGE -->

        <button
            type="button"
            class="attach-option"
            id="imageUploadOption"
        >

            <span class="attach-option-icon">
                📷
            </span>

            <span class="attach-option-text">

                <strong>
                    Upload Image
                </strong>

                <small>
                    Ask questions about an image
                </small>

            </span>

        </button>


        <!-- IMAGE GENERATION -->

        <button
            type="button"
            class="attach-option"
            id="imageGenerateOption"
        >

            <span class="attach-option-icon">
                🎨
            </span>

            <span class="attach-option-text">

                <strong>
                    Generate Image
                </strong>

                <small>
                    Create an image with AI
                </small>

            </span>

        </button>


        <!-- VOICE -->

        <button
            type="button"
            class="attach-option"
            id="voiceOption"
        >

            <span class="attach-option-icon">
                🎤
            </span>

            <span class="attach-option-text">

                <strong>
                    Voice
                </strong>

                <small>
                    Talk with Nexa AI
                </small>

            </span>

        </button>


        <!-- PDF -->

        <button
            type="button"
            class="attach-option"
            id="pdfOption"
        >

            <span class="attach-option-icon">
                📄
            </span>

            <span class="attach-option-text">

                <strong>
                    Upload PDF
                </strong>

                <small>
                    Ask questions from a PDF
                </small>

            </span>

        </button>

    </div>


    <!-- HIDDEN IMAGE INPUT -->

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
    >

</div>
