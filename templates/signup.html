
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - Nexa AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #111318;
            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow-y: auto;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .glow-one {
            position: absolute;

            width: 350px;
            height: 350px;

            top: -150px;
            left: -100px;

            background: rgba(139, 92, 246, 0.10);

            filter: blur(100px);

            border-radius: 50%;
        }

        .glow-two {
            position: absolute;

            width: 300px;
            height: 300px;

            right: -100px;
            bottom: -120px;

            background: rgba(59, 130, 246, 0.08);

            filter: blur(100px);

            border-radius: 50%;
        }

        /* =========================
           CONTAINER
        ========================= */

        .signup-container {
            width: 100%;
            max-width: 420px;

            padding: 20px;

            position: relative;
            z-index: 1;
        }

        .signup-card {
            background: rgba(28, 31, 38, 0.96);

            border: 1px solid #30343d;

            border-radius: 18px;

            padding: 36px 34px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);
        }

        /* =========================
           LOGO
        ========================= */

        .logo-section {
            text-align: center;

            margin-bottom: 28px;
        }

        .logo-icon {
            width: 52px;
            height: 52px;

            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: #252830;

            border: 1px solid #343943;

            font-size: 25px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .logo-name {
            font-size: 23px;
            font-weight: 600;

            letter-spacing: -0.4px;
        }

        .logo-subtitle {
            margin-top: 7px;

            color: #858b97;

            font-size: 13px;
        }

        /* =========================
           TITLE
        ========================= */

        .signup-title {
            font-size: 21px;

            font-weight: 600;

            margin-bottom: 7px;
        }

        .signup-description {
            color: #858b97;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 24px;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 17px;
        }

        .form-label {
            display: block;

            margin-bottom: 8px;

            color: #c5c9d2;

            font-size: 13px;

            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;

            height: 45px;

            padding: 0 13px;

            background: #15181e;

            border: 1px solid #30343d;

            border-radius: 9px;

            outline: none;

            color: #ffffff;

            font-size: 13px;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-input::placeholder {
            color: #606671;
        }

        .form-input:focus {
            border-color: #565d69;

            background: #171a20;

            box-shadow:
                0 0 0 3px
                rgba(139, 146, 158, 0.08);
        }

        /* =========================
           PASSWORD
        ========================= */

        .password-input {
            padding-right: 72px;
        }

        .show-password {
            position: absolute;

            right: 11px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #777d89;

            font-size: 12px;

            cursor: pointer;

            padding: 5px;
        }

        .show-password:hover {
            color: #ffffff;
        }

        /* =========================
           PASSWORD HINT
        ========================= */

        .password-hint {
            margin-top: 6px;

            color: #606671;

            font-size: 11px;
        }

        /* =========================
           SIGNUP BUTTON
        ========================= */

        .signup-button {
            width: 100%;

            height: 45px;

            border: none;

            border-radius: 9px;

            background: #ffffff;

            color: #111318;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .signup-button:hover {
            background: #e7e7e7;

            transform: translateY(-1px);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.25);
        }

        .signup-button:active {
            transform: translateY(0);
        }

        /* =========================
           DIVIDER
        ========================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 24px 0;

            color: #606671;

            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";

            height: 1px;

            flex: 1;

            background: #30343d;
        }

        /* =========================
           LOGIN LINK
        ========================= */

        .login-text {
            text-align: center;

            color: #858b97;

            font-size: 13px;
        }

        .login-link {
            color: #ffffff;

            font-weight: 500;

            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        /* =========================
           ERROR
        ========================= */

        .error-message {
            display: none;

            margin-bottom: 17px;

            padding: 10px 12px;

            border-radius: 8px;

            background:
                rgba(220, 53, 69, 0.10);

            border:
                1px solid
                rgba(220, 53, 69, 0.25);

            color: #e58b94;

            font-size: 12px;

            line-height: 1.4;
        }

        /* =========================
           SUCCESS
        ========================= */

        .success-message {
            display: none;

            margin-bottom: 17px;

            padding: 10px 12px;

            border-radius: 8px;

            background:
                rgba(34, 197, 94, 0.10);

            border:
                1px solid
                rgba(34, 197, 94, 0.25);

            color: #8bd6a5;

            font-size: 12px;

            line-height: 1.4;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            margin-top: 20px;

            color: #555b66;

            font-size: 11px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .signup-container {
                padding: 15px;
            }

            .signup-card {
                padding: 30px 24px;
            }

        }

    </style>

</head>


<body>


    <div class="background">

        <div class="glow-one"></div>

        <div class="glow-two"></div>

    </div>


    <main class="signup-container">


        <div class="signup-card">


            <!-- LOGO -->

            <div class="logo-section">

                <div class="logo-icon">
                    ✦
                </div>

                <div class="logo-name">
                    Nexa AI
                </div>

                <div class="logo-subtitle">
                    Your intelligent AI workspace
                </div>

            </div>


            <!-- TITLE -->

            <h1 class="signup-title">
                Create your account
            </h1>

            <p class="signup-description">
                Create an account to start your AI conversations.
            </p>


            <!-- ERROR -->

            <div
                class="error-message"
                id="errorMessage"
            ></div>


            <!-- SUCCESS -->

            <div
                class="success-message"
                id="successMessage"
            ></div>


            <!-- FORM -->

            <form id="signupForm">


                <!-- NAME -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="name"
                    >
                        Full name
                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-input"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="email"
                    >
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="password"
                    >
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            class="form-input password-input"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            Show
                        </button>

                    </div>

                    <div class="password-hint">
                        Use at least 8 characters.
                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label
                        class="form-label"
                        for="confirmPassword"
                    >
                        Confirm password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-input password-input"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showConfirmPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- SIGNUP BUTTON -->

                <button
                    type="submit"
                    class="signup-button"
                    id="signupButton"
                >
                    Create account
                </button>

            </form>


            <!-- DIVIDER -->

            <div class="divider">
                OR
            </div>


            <!-- LOGIN -->

            <div class="login-text">

                Already have an account?

                <a
                    href="/login"
                    class="login-link"
                >
                    Sign in
                </a>

            </div>


        </div>


        <div class="footer">
            © 2026 Nexa AI
        </div>


    </main>


    <script>

        /* =========================
           PASSWORD TOGGLE
        ========================= */

        const passwordInput =
            document.getElementById(
                "password"
            );

        const showPasswordButton =
            document.getElementById(
                "showPassword"
            );


        showPasswordButton.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    showPasswordButton.textContent =
                        "Hide";

                } else {

                    passwordInput.type =
                        "password";

                    showPasswordButton.textContent =
                        "Show";
                }

            }
        );


        /* =========================
           CONFIRM PASSWORD TOGGLE
        ========================= */

        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );

        const showConfirmPasswordButton =
            document.getElementById(
                "showConfirmPassword"
            );


        showConfirmPasswordButton.addEventListener(
            "click",
            function () {

                if (
                    confirmPasswordInput.type ===
                    "password"
                ) {

                    confirmPasswordInput.type =
                        "text";

                    showConfirmPasswordButton.textContent =
                        "Hide";

                } else {

                    confirmPasswordInput.type =
                        "password";

                    showConfirmPasswordButton.textContent =
                        "Show";
                }

            }
        );


        /* =========================
           FORM
        ========================= */

        const signupForm =
            document.getElementById(
                "signupForm"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );

        const successMessage =
            document.getElementById(
                "successMessage"
            );


        signupForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "name"
                    ).value.trim();

                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();

                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                errorMessage.style.display =
                    "none";

                successMessage.style.display =
                    "none";


                /* PASSWORD CHECK */

                if (
                    password !==
                    confirmPassword
                ) {

                    errorMessage.textContent =
                        "Passwords do not match.";

                    errorMessage.style.display =
                        "block";

                    return;
                }


                try {

                    const response =
                        await fetch(
                            "/api/signup",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    name: name,
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!data.success) {

                        errorMessage.textContent =
                            data.error ||
                            "Unable to create account.";

                        errorMessage.style.display =
                            "block";

                        return;
                    }


                    successMessage.textContent =
                        "Account created successfully. Redirecting to login...";

                    successMessage.style.display =
                        "block";


                    signupForm.reset();


                    setTimeout(
                        function () {

                            window.location.href =
                                "/login";

                        },
                        1200
                    );


                } catch (error) {

                    console.error(
                        "Signup error:",
                        error
                    );

                    errorMessage.textContent =
                        "Unable to connect to the server. Please try again.";

                    errorMessage.style.display =
                        "block";
                }

            }
        );

    </script>


</body>

</html>
